<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Карта</title>
<style>
:root{--bg:#eef1f5;--panel:rgba(255,255,255,.96);--fg:#1c2530;--dim:#5c6c80;--line:#d3dbe4;--acc:#2b7de9;--accfg:#fff;--shadow:0 6px 22px rgba(20,30,45,.22);--void:#0c0c14;--stfg:#c9d3de;--stbg:rgba(0,0,0,.55);--ok:#1f8f4e;--bad:#c93a3a}
:root[data-theme=dark]{--bg:#10151b;--panel:rgba(24,31,40,.95);--fg:#e7edf3;--dim:#8d9bab;--line:#2d3945;--acc:#5aa7ff;--accfg:#08111c;--shadow:0 6px 22px rgba(0,0,0,.55);--void:#0c0c14;--stfg:#c9d3de;--stbg:rgba(0,0,0,.55);--ok:#4cc27d;--bad:#ff7777}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151b;--panel:rgba(24,31,40,.95);--fg:#e7edf3;--dim:#8d9bab;--line:#2d3945;--acc:#5aa7ff;--accfg:#08111c;--shadow:0 6px 22px rgba(0,0,0,.55);--void:#0c0c14;--stfg:#c9d3de;--stbg:rgba(0,0,0,.55);--ok:#4cc27d;--bad:#ff7777}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#map.drag{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));pointer-events:none}
.bar>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
h1{margin:0;font-size:16px;font-weight:650;padding:7px 12px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accfg);font-weight:600}
.seg button:not([aria-pressed=true]):hover{background:rgba(127,140,155,.18)}
.sp{flex:1 1 0}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;box-shadow:var(--shadow)}
.btn[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:transparent}
#sbox{position:relative}
#q{width:230px;max-width:46vw;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);outline:none}
#q:focus{border-color:var(--acc)}
#res{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:50vh;overflow:auto;display:none}
#res button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 11px}
#res button:hover,#res button.on{background:rgba(127,140,155,.18)}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);flex:none}
.dimtxt{color:var(--dim);font-size:12px;margin-left:auto}
.panel{z-index:3;position:fixed;top:calc(58px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:292px;max-height:calc(100% - 130px);overflow:auto;padding:10px 12px;display:none}
.panel.open{display:block}
.seg2{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;margin:2px 0 8px}
.seg2 button{flex:1;border:0;background:none;padding:5px 8px;border-radius:7px;white-space:nowrap}
.seg2 button[aria-pressed=true]{background:var(--acc);color:var(--accfg);font-weight:600}
.seg2 button:not([aria-pressed=true]):hover{background:rgba(127,140,155,.18)}
.grp2{font-weight:600;margin:8px 0 3px}
.panel h2{margin:0 0 6px;font-size:13px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.panel label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.panel .hint{color:var(--dim);font-size:12px;margin-top:6px}
.grp{margin:10px 0 4px;display:flex;gap:8px;align-items:center;font-weight:600}
.item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:7px}
.item:hover{background:rgba(127,140,155,.16)}
.item .sub{color:var(--dim);font-size:12px;margin-left:auto}
#info{z-index:3;position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(36px + env(safe-area-inset-bottom));width:330px;max-width:calc(100% - 20px);max-height:55%;overflow:auto;padding:12px 14px;display:none}
#info.open{display:block}
#info h3{margin:0 0 2px;font-size:17px;display:flex;gap:8px;align-items:center}
#info .meta{color:var(--dim);font-size:12.5px;margin-bottom:6px}
#info p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
#info .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#info .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:20px;color:var(--dim);padding:2px 8px}
#info .small{border:1px solid var(--line);background:none;padding:4px 10px;border-radius:8px}
#info .small:hover{background:rgba(127,140,155,.16)}
#tip{position:fixed;pointer-events:none;display:none;padding:5px 9px;border-radius:8px;font-size:13px;z-index:5;max-width:260px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
#status{z-index:1;position:fixed;left:0;right:0;bottom:0;padding:5px calc(12px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));font-size:12px;color:var(--stfg);background:linear-gradient(transparent,var(--stbg));display:flex;gap:14px;flex-wrap:wrap;pointer-events:none}
#zoom{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:20px;line-height:1}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;text-align:center;max-width:min(520px,90vw);display:none}
#pEdit{z-index:3;position:fixed;top:calc(58px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:320px;max-height:calc(100% - 110px);overflow:auto;padding:10px 12px;display:none}
#pEdit.open{display:block}
#pEdit h2,#sendBox h2{margin:0 0 6px;font-size:13px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#pEdit .hint,#sendBox .hint{color:var(--dim);font-size:12px;margin:4px 0}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 8px}
.tools button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 2px;font-size:12.5px}
.tools button[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600}
.tools button:not([aria-pressed=true]):hover{background:rgba(127,140,155,.18)}
.fld{display:flex;flex-direction:column;gap:4px;margin:7px 0}
.fld.box{border:1px solid var(--line);border-radius:9px;padding:8px}
.lbl{font-size:12px;color:var(--dim);font-weight:600}
.fld input[type=text],.fld select,.fld textarea,#sendBox textarea,#sendBox input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit}
.fld select{flex:1 1 0;min-width:0}
.fld input[type=color]{width:44px;height:32px;padding:1px;border:1px solid var(--line);border-radius:8px;background:none;flex:none}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row2.end{margin-top:10px}
.pbtn{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 11px}
.pbtn:hover:not([disabled]){background:rgba(127,140,155,.18)}
.pbtn[disabled]{opacity:.45;cursor:default}
.pbtn.pri{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600}
.cur{display:flex;gap:7px;align-items:center;font-size:13px}
.li{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12.5px;padding:2px 0}
.x2{border:0;background:none;color:var(--dim);font-size:17px;padding:0 6px}
.sum{font-size:12.5px;color:var(--dim);margin:8px 0 2px}
.msg{font-size:12.5px;min-height:1.2em;color:var(--bad)}
.msg.good{color:var(--ok)}
#sendBox{z-index:6;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,94vw);max-height:90%;overflow:auto;padding:14px 16px;display:none}
#sendBox .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;color:var(--dim)}
#sendBox textarea{resize:vertical}
@media (max-width:760px){
  #pEdit{left:10px;right:10px;width:auto;top:auto;bottom:calc(40px + env(safe-area-inset-bottom));max-height:56%}
}
@media (max-width:760px){
  h1{max-width:100%;flex:1 1 100%;padding:6px 10px}
  #q{width:100%;max-width:none}#sbox{flex:1 1 100%;order:5}
  .panel{left:10px;right:10px;width:auto;top:auto;bottom:calc(40px + env(safe-area-inset-bottom));max-height:52%}
  #info{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:14px 14px 0 0;max-height:46%;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  #zoom{top:34%;bottom:auto}
}
</style>
</head>
<body>
<canvas id="map" tabindex="0" aria-label="Карта світу"></canvas>
<div class="bar">
  <h1 class="card" id="title">Карта</h1>
  <div class="seg card" id="worlds" role="group" aria-label="Світ"></div>
  <div class="sp"></div>
  <div id="sbox"><input id="q" type="search" placeholder="Пошук: держава чи місто" autocomplete="off" aria-label="Пошук"><div id="res" class="card" role="listbox"></div></div>
  <button class="btn" id="bEdit" aria-pressed="false" title="Намалювати свою версію карти й надіслати адміністратору">&#9998; Запропонувати зміни</button>
  <button class="btn" id="bLayers" aria-pressed="false">Шари</button>
  <button class="btn" id="bList" aria-pressed="false">Держави</button>
  <button class="btn" id="bSet" aria-pressed="false" aria-label="Налаштування" title="Налаштування">&#9881;</button>
</div>
<div class="panel card" id="pSet" aria-label="Налаштування"></div>
<div class="card" id="pEdit" aria-label="Режим пропозицій"></div>
<div class="card" id="sendBox" role="dialog" aria-label="Надіслати пропозицію"></div>
<div class="panel card" id="pLayers" aria-label="Шари"></div>
<div class="panel card" id="pList" aria-label="Список держав"></div>
<div class="card" id="info" role="dialog" aria-live="polite"></div>
<div id="tip"></div>
<div id="zoom"><button id="zin" aria-label="Наблизити">+</button><button id="zout" aria-label="Віддалити">&minus;</button><button id="zfit" aria-label="Показати все" title="Показати все" style="font-size:15px">&#9974;</button></div>
<div id="status"></div>
<div class="card" id="msg"></div>
<noscript>Для перегляду карти потрібен JavaScript.</noscript>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const cv = $("#map"), ctx = cv.getContext("2d");
const KIND = {capital: "Столиця", city: "Місто", town: "Містечко", port: "Порт", fort: "Фортеця", other: "Інше"};
let D = null, W = null, P = null;
const settings = {theme: "auto", detail: "basic"};          // деталізація «Базова»: легка версія сайту за замовчуванням
const TH = {dark: true, void: "#0c0c14", inc: "rgba(178,188,204,.55)", grid: "255,255,255", gridText: "#e8eef4", gridBg: "rgba(0,0,0,.55)"};
let cw = 0, ch = 0, dpr = 1;
const view = {x: 0, z: 0, s: 1};
const views = {};
let sel = null;
let hover = null;
const layers = {terrain: true, incognita: true, fills: true, borders: true, labels: true, cities: true, spawn: true, grid: false, ally: false, players: true};
const LAYER_TEXT = [["terrain", "Рельєф"], ["incognita", "Невивчені ділянки"], ["fills", "Території держав"], ["borders", "Межі"], ["labels", "Назви держав"], ["cities", "Міста й столиці"],
  ["spawn", "Спавн"], ["ally", "Кольори союзів"], ["grid", "Сітка координат"], ["players", "Гравці онлайн"]];

// ---------- допоміжне
const el = (tag, props, ...kids) => { const e = document.createElement(tag); if (props) for (const k in props) { if (props[k] == null || props[k] === false) continue; if (k === "class") e.className = props[k]; else if (k === "text") e.textContent = props[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]); else e.setAttribute(k, props[k]); } for (const c of kids) if (c) e.append(c); return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hexRgb(h) { h = String(h || "#888888"); if (!/^#[0-9a-fA-F]{6}$/.test(h)) h = "#888888"; return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const rgba = (h, a) => { const c = hexRgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };
function ago(sec) { sec = Math.max(0, Math.round(sec)); if (sec < 60) return "щойно"; if (sec < 3600) return Math.round(sec / 60) + " хв тому"; if (sec < 172800) return Math.round(sec / 3600) + " год тому"; return Math.round(sec / 86400) + " дн. тому"; }
function applyTheme() {
  const dark = settings.theme === "dark" || (settings.theme === "auto" && !!window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches);
  const r = document.documentElement;
  if (settings.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", settings.theme);
  TH.dark = dark;                                       // сама карта (плитки з темним тлом «порожнечі») однакова в обох темах: міняється лише оформлення панелей
}
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } return null; }
const stateOf = id => D.statesById[id] || null;
function colorOf(s) { if (!s) return "#9aa5b1"; if (layers.ally && s.alliance && D.alliancesById[s.alliance]) return D.alliancesById[s.alliance].color; return s.color; }

// ---------- завантаження
async function getJSON(url) { const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"}); if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); }
function showMsg(text) { const m = $("#msg"); m.textContent = text; m.style.display = text ? "block" : "none"; }

try { const sv = JSON.parse(store("tm-settings") || "{}"); if (["auto", "light", "dark"].includes(sv.theme)) settings.theme = sv.theme; if (["basic", "high"].includes(sv.detail)) settings.detail = sv.detail; } catch (e) {}
applyTheme();
if (window.matchMedia) { try { matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => { if (settings.theme === "auto") { applyTheme(); draw(); } }); } catch (e) {} }
async function init() {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }   // кеш плиток: повторне відкриття карти майже миттєве
  try { D = await getJSON("data.json"); }
  catch (e) {
    showMsg(location.protocol === "file:" ? "Браузер не дає відкрити карту прямо з файлу. Відкрийте її через панель (кнопка «Переглянути») або через сайт." : "Не вдалося завантажити дані карти. Спробуйте оновити сторінку.");
    return;
  }
  D.statesById = {}; D.alliancesById = {};
  for (const s of D.states || []) D.statesById[s.id] = s;
  for (const a of D.alliances || []) D.alliancesById[a.id] = a;
  for (const w of D.worlds || []) prepWorld(w);
  document.title = D.title || "Карта";
  $("#title").textContent = D.title || "Карта";
  try { const saved = JSON.parse(store("tm-layers") || "{}"); for (const k in layers) if (typeof saved[k] === "boolean") layers[k] = saved[k]; } catch (e) {}
  buildSettings(); loadDraft();
  if (D.players && D.players.enabled === false) delete layers.players;
  buildWorlds(); buildLayers(); buildList();
  const h = parseHash();
  const w = (D.worlds || []).find(x => x.id === h.w) || (D.worlds || [])[0];
  if (!w) { showMsg("На карті поки нічого немає."); return; }
  resize();                                   // спершу розмір полотна: за ним рахується початковий масштаб
  setWorld(w.id, h);
  if (D.players && D.players.enabled) { pollPlayers(); setInterval(pollPlayers, 15000); }
  setInterval(updStatus, 30000);
}

function prepWorld(w) {
  w.have = {}; w.ver = {};                       // ver: версія кожної плитки (?v=…): незмінна плитка береться з кешу браузера без запиту в мережу
  if (w.tiles) for (const d in w.tiles.have) { const set = new Set(); for (const t of w.tiles.have[d]) { set.add(t[0] + "_" + t[1]); if (t[2]) w.ver[d + "/" + t[0] + "_" + t[1]] = t[2]; } w.have[d] = set; }
  for (const L of w.land || []) {
    let x0 = 1e9, z0 = 1e9, x1 = -1e9, z1 = -1e9, ar = L.area || 0;
    for (const r of L.rects) { x0 = Math.min(x0, r[0] * 16); z0 = Math.min(z0, r[1] * 16); x1 = Math.max(x1, r[2] * 16); z1 = Math.max(z1, r[3] * 16); }
    for (const p of L.polys) for (const q of p) { x0 = Math.min(x0, q[0]); z0 = Math.min(z0, q[1]); x1 = Math.max(x1, q[0]); z1 = Math.max(z1, q[1]); }
    L.bb = [x0, z0, x1, z1]; L.area = ar || (x1 - x0) * (z1 - z0);
  }
  w.landById = {}; for (const L of w.land || []) w.landById[L.s] = L;
  w.dimName = w.name;
}

function worldBounds(w) {
  let b = null;
  const add = (x0, z0, x1, z1) => { b = b ? [Math.min(b[0], x0), Math.min(b[1], z0), Math.max(b[2], x1), Math.max(b[3], z1)] : [x0, z0, x1, z1]; };
  for (const L of w.land || []) add(...L.bb);
  for (const c of w.cities || []) add(c.x, c.z, c.x, c.z);
  if (w.spawn) add(w.spawn[0], w.spawn[1], w.spawn[0], w.spawn[1]);
  if (!b && w.tiles) add(...w.tiles.bounds);
  return b || [-256, -256, 256, 256];
}
function fitScale(b, pad) { const bw = Math.max(b[2] - b[0], 64), bh = Math.max(b[3] - b[1], 64); return clamp(Math.min(Math.max(cw, 320) / (bw * pad), Math.max(ch - 110, 240) / (bh * pad)), 0.004, 8); }
function fitView(b, pad) { view.s = fitScale(b, pad || 1.25); view.x = (b[0] + b[2]) / 2; view.z = (b[1] + b[3]) / 2; }

// ---------- світи
function setWorld(id, h) {
  if (W) views[W.id] = {x: view.x, z: view.z, s: view.s};
  W = D.worlds.find(w => w.id === id) || D.worlds[0];
  sel = null; hover = null; closeInfo();
  const v = (h && h.w === W.id && isFinite(h.x) && isFinite(h.z) && isFinite(h.s)) ? {x: h.x, z: h.z, s: clamp(h.s, 0.004, 24)} : views[W.id];
  if (v) Object.assign(view, v); else fitView(worldBounds(W));
  for (const b of document.querySelectorAll("#worlds button")) b.setAttribute("aria-pressed", b.dataset.id === W.id ? "true" : "false");
  if (h && h.sel && W.landById[h.sel]) selectState(h.sel, false);
  preloadTop(); prefetchAll(); updStatus(); draw(); saveHashSoon();
}
function buildWorlds() {
  const box = $("#worlds"); box.textContent = "";
  for (const w of D.worlds) box.append(el("button", {"data-id": w.id, "aria-pressed": "false", text: w.name, onclick: () => setWorld(w.id)}));
  box.style.display = D.worlds.length > 1 ? "flex" : "none";
}

// ---------- панелі
function buildLayers() {
  const p = $("#pLayers"); p.textContent = "";
  p.append(el("h2", {text: "Шари"}));
  for (const [k, t] of LAYER_TEXT) {
    if (!(k in layers)) continue;
    const cb = el("input", {type: "checkbox"}); cb.checked = layers[k];
    cb.addEventListener("change", () => { layers[k] = cb.checked; store("tm-layers", JSON.stringify(layers)); if (k === "ally") buildList(); draw(); });
    p.append(el("label", null, cb, el("span", {text: t})));
  }
